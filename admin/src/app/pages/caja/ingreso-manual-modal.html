<app-modal [title]="'Ingreso manual'" [width]="'480px'" (closed)="cerrado.emit()">
  <div class="form">
    @if (errorBanner()) {
      <div class="error-banner">{{ errorBanner() }}</div>
    }

    <div class="field">
      <label>Descripción *</label>
      <input
        class="input"
        type="text"
        [(ngModel)]="descripcion"
        name="descripcion"
        maxlength="191"
        placeholder="Ej. Aporte de capital, devolución de proveedor…"
      />
      @if (errorDe('descripcion')) {
        <span class="field-error">{{ errorDe('descripcion') }}</span>
      }
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Monto (Bs) *</label>
        <input
          class="input"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="monto"
          name="monto"
        />
        @if (errorDe('monto')) {
          <span class="field-error">{{ errorDe('monto') }}</span>
        }
      </div>

      <div class="field">
        <label>Fecha *</label>
        <input class="input" type="date" [(ngModel)]="fecha" name="fecha" />
        @if (errorDe('fecha')) {
          <span class="field-error">{{ errorDe('fecha') }}</span>
        }
      </div>
    </div>

    <p class="hint">Se suma a la caja como una entrada de dinero. No está vinculada a ningún pedido.</p>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" (click)="cerrado.emit()" [disabled]="guardando()">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando()">
        {{ guardando() ? 'Registrando…' : 'Registrar ingreso' }}
      </button>
    </div>
  </div>
</app-modal>
